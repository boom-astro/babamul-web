networks:
  traefik-public:
    external: true

services:
  web:
    image: boom-astro/boom-web:latest
    hostname: web
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BOOM_API__DOMAIN: ${BOOM_API__DOMAIN:-api.${DOMAIN?Variable not set}}
        BOOM_KAFKA__DOMAIN: ${DOMAIN?Variable not set}:9093
        VITE_PRERELEASE_MODE: ${VITE_PRERELEASE_MODE:-false}
        VITE_PUBLIC_POSTHOG_KEY: ${VITE_PUBLIC_POSTHOG_KEY?Variable not set}
        VITE_PUBLIC_POSTHOG_HOST: ${VITE_PUBLIC_POSTHOG_HOST?Variable not set}
    environment:
      BOOM_API__DOMAIN: ${BOOM_API__DOMAIN:-api.${DOMAIN?Variable not set}}
      BOOM_KAFKA__DOMAIN: ${DOMAIN?Variable not set}:9093
      VITE_PRERELEASE_MODE: ${VITE_PRERELEASE_MODE:-false}
      VITE_PUBLIC_POSTHOG_KEY: ${VITE_PUBLIC_POSTHOG_KEY?Variable not set}
      VITE_PUBLIC_POSTHOG_HOST: ${VITE_PUBLIC_POSTHOG_HOST?Variable not set}
    restart: always
    networks:
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public
      - traefik.http.services.${STACK_NAME?Variable not set}-web.loadbalancer.server.port=80
      - traefik.http.routers.${STACK_NAME?Variable not set}-web-http.rule=Host(`${WEBAPP_DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-web-http.entrypoints=http
      - traefik.http.routers.${STACK_NAME?Variable not set}-web-https.rule=Host(`${WEBAPP_DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-web-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME?Variable not set}-web-https.tls=true
      - traefik.http.routers.${STACK_NAME?Variable not set}-web-https.tls.certresolver=le
      # Define compression middleware
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-compress.compress=true
      # Define Traefik Middleware to handle domain with and without "www" to redirect to only one
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-www-redirect.redirectregex.regex=^http(s)?://www.(${WEBAPP_DOMAIN?Variable not set})/(.*)
      # Redirect a domain with www to non-www
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-www-redirect.redirectregex.replacement=http$${1}://${WEBAPP_DOMAIN?Variable not set}/$${3}
      # Define HTTPS redirect middleware
      - traefik.http.middlewares.https-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.https-redirect.redirectscheme.permanent=true
      # Security headers middleware
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-security-headers.headers.frameDeny=true
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-security-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-security-headers.headers.browserXssFilter=true
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-security-headers.headers.referrerPolicy=strict-origin-when-cross-origin
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-security-headers.headers.permissionsPolicy=camera=(), microphone=(), geolocation=()
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-security-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-security-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-security-headers.headers.stsPreload=true
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-security-headers.headers.contentSecurityPolicy=default-src 'self'; script-src 'self' https://${VITE_PUBLIC_POSTHOG_HOST?Variable not set}; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://${VITE_PUBLIC_POSTHOG_HOST?Variable not set} wss://${DOMAIN?Variable not set}:9093
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-security-headers.headers.customResponseHeaders.Server=
      # Enable www redirection for HTTP and HTTPS
      - traefik.http.routers.${STACK_NAME?Variable not set}-web-http.middlewares=https-redirect,${STACK_NAME?Variable not set}-www-redirect
      - traefik.http.routers.${STACK_NAME?Variable not set}-web-https.middlewares=${STACK_NAME?Variable not set}-www-redirect,${STACK_NAME?Variable not set}-compress,${STACK_NAME?Variable not set}-security-headers
